{{- range $name := list "gateway" "client" "signaling" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: {{ if eq $name "gateway" }}{{ $.Values.gatewayReplicas }}{{ else }}1{{ end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: {{ $name }}}
  template:
    metadata:
      labels: {app: {{ $name }}}
      annotations:
        prometheus.io/scrape: {{ if eq $name "gateway" }}"true"{{ else }}"false"{{ end }}
        prometheus.io/port: "8001"
    spec:
      serviceAccountName: pulse
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ if eq $name "client" }}101{{ else }}10001{{ end }}
        fsGroup: {{ if eq $name "client" }}101{{ else }}10001{{ end }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $name }}
          image: {{ index $.Values.images $name | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - name: http
              containerPort: {{ if eq $name "gateway" }}8001{{ else if eq $name "client" }}8080{{ else }}8002{{ end }}
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: ALLOWED_ORIGINS
              value: {{ $.Values.allowedOrigins | quote }}
            {{- if ne $name "client" }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef: {name: {{ $.Values.existingSecret }}, key: session-secret}
            {{- end }}
            {{- if eq $name "gateway" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ $.Values.existingSecret }}, key: database-url}
            - name: REDIS_URL
              value: redis://redis:6379
            {{- end }}
          readinessProbe:
            httpGet: {path: {{ if eq $name "gateway" }}/ready{{ else }}/health{{ end }}, port: http}
            periodSeconds: 5
            timeoutSeconds: 4
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 30
            periodSeconds: 5
          lifecycle:
            preStop:
              exec: {command: ["/bin/sh", "-c", "sleep 5"]}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {app: {{ $name }}}
spec:
  selector: {app: {{ $name }}}
  ports:
    - name: http
      port: {{ if eq $name "gateway" }}8001{{ else if eq $name "client" }}8080{{ else }}8002{{ end }}
      targetPort: http
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulse
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: gateway}

{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: gateway}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPU }}}
---
{{- end }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: client, port: {number: 8080}}
---
{{- end }}
{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pulse
  labels: {release: monitoring}
spec:
  selector:
    matchLabels: {app: gateway}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pulse
  labels: {release: monitoring}
spec:
  groups:
    - name: pulse
      rules:
        - alert: PulseGatewayUnavailable
          expr: sum(up{service="gateway"}) < 1 or absent(up{service="gateway"})
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: No Pulse gateway is scrapeable
            description: Check readiness, Redis, PostgreSQL, and recent rollouts.
        - alert: PulseErrorSpike
          expr: sum(rate(pulse_errors_total[5m])) > 1
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: More than one rejected or failed message per second
            description: Inspect gateway logs and dependency health before restarting pods.
{{- end }}

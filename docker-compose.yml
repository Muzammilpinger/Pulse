services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./gateway
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://pulse:pulse@postgres:5432/pulse
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  coturn:
    image: coturn/coturn:latest
    command:
      - turnserver
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --lt-cred-mech
      - --realm=pulse.local
      - --user=pulse:pulse
      - --listening-port=3478
      - --min-port=49152
      - --max-port=49252
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49252:49152-49252/udp"

volumes:
  postgres_data:
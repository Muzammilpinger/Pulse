name: Verify Pulse
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: client/package-lock.json}
      - run: pip install -r tests/requirements.txt ruff==0.16.8
      - run: ruff check gateway signaling tests scripts
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: docker compose up -d --build --wait
      - run: pytest -q tests
      - run: npx playwright test
        working-directory: client
      - if: failure()
        run: docker compose logs --tail=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: client/test-results
      - if: always()
        run: docker compose down -v
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.17.3}
      - run: helm lint deploy/helm/pulse
      - run: helm template pulse deploy/helm/pulse --set autoscaling.enabled=true --set ingress.enabled=true > /tmp/pulse.yaml
  images:
    needs: [integration, helm]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      matrix:
        service: [gateway, client, signaling]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: pulse-${{ matrix.service }}:scan
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: pulse-${{ matrix.service }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ghcr.io/muzammilpinger/pulse-${{ matrix.service }}:${{ github.sha }}
          provenance: true
          sbom: true
